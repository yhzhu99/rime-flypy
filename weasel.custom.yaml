# Windows Weasel frontend settings.
patch:
  global_ascii: true  # Share the selected input language across applications.
  # Replace upstream cmd.exe/conhost.exe ASCII defaults, retaining only UI fixes.
  app_options:
    firefox.exe: { inline_preedit: true }
  preset_color_schemes:
    paper_light:
      name: "清浅"
      author: "Yinghao"
      back_color: 0xF7FAFA
      border_color: 0xE6E2DE
      candidate_text_color: 0x312A25
      comment_text_color: 0x6F6359
      hilited_back_color: 0xF7FAFA
      hilited_candidate_back_color: 0xF7EDE4
      hilited_candidate_text_color: 0x312A25
      hilited_comment_text_color: 0x6F6359
      hilited_label_color: 0x6F6359
      hilited_text_color: 0x312A25
      label_color: 0x6F6359
      shadow_color: 0x00000000
      text_color: 0x312A25
  style:
    color_scheme: paper_light
    font_face: "Noto Sans, LXGW WenKai"
    label_font_face: "Noto Sans, LXGW WenKai"
    comment_font_face: "Noto Sans, LXGW WenKai"
    font_point: 16
    label_font_point: 12
    comment_font_point: 13
    horizontal: true
    vertical_text: false
    inline_preedit: true
    layout:
        align_type: bottom
        border: 1
        spacing: 8
        candidate_spacing: 20
        hilite_spacing: 5
        hilite_padding: 5
        margin_x: 8
        margin_y: 6
        round_corner: 0
        corner_radius: 6
        shadow_radius: 0
        shadow_offset_x: 0
        shadow_offset_y: 0
