# Shared by Weasel, IBus/Fcitx Rime, and Squirrel.
# Requires librime with set_ascii_mode support and the librime-lua plugin.
patch:
  schema_list:
    - schema: flypy
  switcher/hotkeys: false

  # Physical Caps Lock/Escape and left Ctrl/Alt swaps belong to the OS layer.
  ascii_composer/good_old_caps_lock: true
  ascii_composer/switch_key:
    Caps_Lock: noop
    Shift_L: set_ascii_mode
    Shift_R: noop
    Alt_L: noop
    Alt_R: noop
    Control_L: noop
    Control_R: noop

  # Physical right Alt is mapped to F13 by the platform configuration.
  # lua/right_alt_f13.lua consumes F13 before English-mode passthrough.
  key_binder/bindings:
    - { when: paging, accept: bracketleft, send: Page_Up }
    - { when: has_menu, accept: bracketright, send: Page_Down }
    - { when: always, accept: "Shift+space", send: "Shift+space" }
