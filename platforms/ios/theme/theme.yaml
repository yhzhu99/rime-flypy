config_version: "1.0.6"
style:
  __include: ./../public/style/default:/style
preset_styles:
  __include: ./../public/preset_styles/default:/preset_styles
preset_candidates:
  __include: ./../public/preset_candidates/default:/preset_candidates
preset_fonts:
  __include: ./../public/preset_fonts/default:/preset_fonts
  default:
    key_upper_text_size: 11
preset_color_schemes:
  __include: ./../public/preset_color_schemes/default:/preset_color_schemes
preset_keys:
  __include: ./../public/preset_keys/default:/preset_keys
  flypy_semicolon: {label: "；", send: semicolon}
  flypy_reverse: {label: "`", send: grave, functional: false}
  flypy_cancel: {label: "清码", send: Escape}
  flypy_period: {label: "。", text: "{.}"}
  flypy_to_english: {label: "英", send: Eisu_toggle, select: english}
  flypy_to_chinese: {label: "中", send: Eisu_toggle, select: default}
  flypy_ascii_exclamation: {label: "!", commit: "!"}
  flypy_ascii_semicolon: {label: ";", commit: ";"}
  flypy_equals: {label: "=", commit: "="}
  flypy_pipe: {label: "|", commit: "|"}
  flypy_parentheses: {label: "()", text: "(){Left}"}
  flypy_brackets: {label: "[]", text: "[]{Left}"}
  flypy_left_paren: {label: "(", commit: "("}
  flypy_right_paren: {label: ")", commit: ")"}
  flypy_left_bracket: {label: "[", commit: "["}
  flypy_right_bracket: {label: "]", commit: "]"}
  flypy_full_parentheses: {label: "（）", text: "（）{Left}"}
  flypy_full_brackets: {label: "【】", text: "【】{Left}"}
  flypy_full_left_paren: {label: "（", commit: "（"}
  flypy_full_right_paren: {label: "）", commit: "）"}
  flypy_full_left_bracket: {label: "【", commit: "【"}
  flypy_full_right_bracket: {label: "】", commit: "】"}
preset_keyboards:
  __include: ./../public/preset_keyboards/default:/preset_keyboards
  __patch:
    number/keys/@last/swipe_up: next
    symbols/keys/@last/swipe_up: next
  default:
    __include: ./layout:/geometry
    name: default
    ascii_mode: 0
    keys:
      __include: ./layout:/letters
    keys/+:
      - {click: eisu_toggle_123_number, swipe_up: eisu_toggle_符_symbols, width: 13, name: number, preview: false}
      - {click: flypy_to_english, label: "中", long_click: [eisu_toggle_common_setting_board], width: 12, name: english, preview: false}
      - {click: text_halfcomma, swipe_up: flypy_period, swipe_down: commit_half_comma, long_click: [flypy_period, commit_half_dot, "？", "！"], width: 11, name: punctuation, preview: false}
      - {click: space, swipe_up: flypy_to_english, width: 36, name: space, preview: false}
      - {click: flypy_semicolon, has_menu: select_second, swipe_up: flypy_reverse, long_click: [flypy_reverse, flypy_cancel], width: 11, name: secondary, preview: false}
      - {click: return, composing: confirm, swipe_up: next, width: 17, name: return, preview: false}
  english:
    __include: ./layout:/geometry
    name: english
    ascii_mode: 1
    lock: true
    keys:
      __include: ./layout:/letters
    keys/+:
      - {click: eisu_toggle_123_number, swipe_up: eisu_toggle_符_symbols, width: 13, name: number, preview: false}
      - {click: flypy_to_chinese, label: "英", long_click: [eisu_toggle_common_setting_board], width: 12, name: english, preview: false}
      - {click: commit_half_comma, long_click: [commit_half_questionmark, flypy_ascii_exclamation], width: 11, name: punctuation, preview: false}
      - {click: space, swipe_up: flypy_to_chinese, width: 36, name: space, preview: false}
      - {click: commit_half_dot, width: 11, name: secondary, preview: false}
      - {click: return, swipe_up: next, width: 17, name: return, preview: false}
    __patch:
      keys/@11/swipe_up: "~"
      keys/@14/swipe_up: flypy_ascii_semicolon
      keys/@15/swipe_up: flypy_parentheses
      keys/@15/long_click: [flypy_left_paren, flypy_right_paren]
      keys/@16/swipe_up: flypy_brackets
      keys/@16/long_click: [flypy_left_bracket, flypy_right_bracket]
      keys/@25/swipe_up: commit_half_questionmark
      keys/@25/swipe_down: commit_half_questionmark
      keys/@26/swipe_up: flypy_ascii_exclamation
      keys/@26/swipe_down: flypy_ascii_exclamation
