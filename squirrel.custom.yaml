# macOS Squirrel frontend settings; key behavior lives in default.custom.yaml.
patch:
  style/color_scheme: paper_light
  style/color_scheme_dark: paper_light
  style/candidate_list_layout: linear
  style/text_orientation: horizontal
  style/inline_preedit: true
  style/font_face: "Noto Sans-Regular, LXGW WenKai-Regular"
  style/label_font_face: "Noto Sans-Regular, LXGW WenKai-Regular"
  style/comment_font_face: "Noto Sans-Regular, LXGW WenKai-Regular"
  style/font_point: 16
  style/label_font_point: 12
  style/comment_font_point: 13
  style/corner_radius: 6
  style/hilited_corner_radius: 0
  style/border_width: 8
  style/border_height: 8
  style/spacing: 8
  preset_color_schemes/paper_light:
    name: 清浅
    author: Yinghao
    back_color: 0xF7FAFA
    border_color: 0xE6E2DE
    text_color: 0x312A25
    candidate_text_color: 0x312A25
    comment_text_color: 0x695D53
    label_color: 0x695D53
    hilited_text_color: 0x312A25
    hilited_back_color: 0xF7FAFA
    hilited_candidate_text_color: 0x312A25
    hilited_candidate_back_color: 0xF5DFCC
    hilited_comment_text_color: 0x695D53
    hilited_candidate_label_color: 0x695D53
  # Replace the full upstream map so Terminal, VS Code, MacVim, etc. cannot
  # override the shared language. Keep only display compatibility workarounds.
  app_options:
    com.apple.Terminal: { no_inline: true }
    com.googlecode.iterm2: { no_inline: true }
    org.vim.MacVim: { no_inline: true }
    org.alacritty: { force_marked_text_for_direct_commit: true }
    com.google.Chrome: { inline: true }
    com.microsoft.edgemac: { inline: true }
    ru.keepcoder.Telegram: { inline: true }
