# macOS Squirrel frontend settings; key behavior lives in default.custom.yaml.
patch:
  style/color_scheme: Catppuccin
  style/candidate_list_layout: linear
  style/text_orientation: horizontal
  style/inline_preedit: true
  style/font_point: 13
  style/label_font_point: 11
  style/comment_font_point: 12
  preset_color_schemes/Catppuccin:
    name: Catppuccin
    author: Yinghao
    back_color: 0xF5EDE8
    border_color: 0xE8D5CF
    text_color: 0xB85F40
    candidate_text_color: 0x5B4D47
    comment_text_color: 0x6E96B8
    label_color: 0xA28780
    hilited_text_color: 0x4A5585
    hilited_back_color: 0xFFE8E0
    hilited_candidate_text_color: 0x4A5585
    hilited_candidate_back_color: 0xE8D5CF
    hilited_comment_text_color: 0x6E96B8
    hilited_candidate_label_color: 0x8C7B73
  app_options/com.microsoft.VSCode:
    ascii_mode: false  # Start in Chinese; left Shift explicitly selects English.
    vim_mode: false
  app_options/com.google.Chrome/inline: true
  app_options/ru.keepcoder.Telegram/inline: true
