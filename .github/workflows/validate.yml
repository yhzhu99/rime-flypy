name: Validate input configuration
on: [push, pull_request]
permissions:
  contents: read

jobs:
  configuration:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.17'
      - run: uv python install
      - run: uv run --with-requirements tests/requirements.txt python -m unittest discover -s tests -p "test_*.py" -v
      - name: Preview setup without changing the runner
        run: uv run setup.py --config-only --rime-dir "${{ runner.temp }}/rime-preview"
      - name: Preview system-font desktop preferences without changing the runner
        run: uv run appearance.py
      - name: Confirm Windows and macOS appearance setup installs nothing
        if: runner.os != 'Linux'
        run: uv run appearance.py --apply
      - name: Verify Windows system font availability and glyphs
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Add-Type -AssemblyName PresentationCore
          $families = @([System.Windows.Media.Fonts]::SystemFontFamilies | ForEach-Object { $_.Source })
          foreach ($entry in @(@('Segoe UI', 0x0041), @('Microsoft YaHei', 0x4e2d))) {
            if ($families -notcontains $entry[0]) { throw "Missing system font: $($entry[0])" }
            $face = New-Object System.Windows.Media.Typeface($entry[0])
            $glyph = $null
            if (-not $face.TryGetGlyphTypeface([ref]$glyph)) { throw "Cannot load system font: $($entry[0])" }
            if (-not $glyph.CharacterToGlyphMap.ContainsKey([int]$entry[1])) { throw "Missing expected glyph: $($entry[0])" }
          }
      - name: Verify macOS system font families and glyphs
        if: runner.os == 'macOS'
        run: |
          swift - <<'SWIFT'
          import AppKit
          for (family, sample) in [("Helvetica Neue", "A"), ("PingFang SC", "中")] {
            let descriptor = NSFontDescriptor(fontAttributes: [.family: family, .face: "Regular"])
            guard let font = NSFont(descriptor: descriptor, size: 16), font.familyName == family else {
              fatalError("System font unavailable: \(family)")
            }
            precondition(font.coveredCharacterSet.isSuperset(of: CharacterSet(charactersIn: sample)))
          }
          SWIFT
      - name: Exercise Linux system fallback and real IBus settings in a temporary desktop bus
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ibus fontconfig dbus-x11 fonts-noto-cjk
          dbus-run-session -- uv run appearance.py --apply
          for glyph in 0041 4e2d; do
            matched=$(fc-match -f '%{file}\n' "Sans:charset=$glyph")
            fc-list ":charset=$glyph" -f '%{file}\n' | grep -Fx "$matched"
          done
      - name: Windows map merge and preservation tests
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./tests/keyboard.Tests.ps1
          ./platforms/windows/install-rime.ps1

  librime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.17'
      - run: uv python install
      - name: Extract official engine and shared data without installing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 1.17.0 --repo rime/librime --pattern rime-33e7814-Windows-msvc-x64.7z --dir .local
          gh release download 0.17.4 --repo rime/weasel --pattern weasel-0.17.4.0-installer.exe --dir .local
          if ((Get-FileHash .local/rime-33e7814-Windows-msvc-x64.7z).Hash -ne '7478C7CAA4FF6B37DE86DABA1F7CE4A994A4F5BA24872A820FB2B3A9B01FED15') { throw 'Engine archive hash mismatch' }
          if ((Get-FileHash .local/weasel-0.17.4.0-installer.exe).Hash -ne 'CF509534A8F5F8AF9C98ED7CBB8F135439F145A8CBE7E50EDE42BB5B5AB45C29') { throw 'Shared data archive hash mismatch' }
          7z x .local/rime-33e7814-Windows-msvc-x64.7z '-o.local/engine' -y
          if ($LASTEXITCODE -ne 0) { throw 'Engine extraction failed' }
          7z x .local/weasel-0.17.4.0-installer.exe '-o.local/weasel' -y
          if ($LASTEXITCODE -ne 0) { throw 'Shared data extraction failed' }
      - name: Test real input behavior in a temporary user directory
        run: |
          uv run python -c "from pathlib import Path; import setup; setup.require_recent_engine(Path('.local/engine/dist/lib/rime.dll').resolve())"
          if ($LASTEXITCODE -ne 0) { throw 'Engine prerequisite check failed' }
          uv run tests/librime_behavior.py .local/engine/dist/lib/rime.dll .local/weasel/data

  keyd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rvaiya/keyd
          ref: f564288ac2b19d2305a5b39023c474805ff8fce5
          path: .local/keyd
      - name: Validate with keyd's actual config parser
        run: |
          make -C .local/keyd
          .local/keyd/bin/keyd check platforms/linux/rime-flypy.conf
